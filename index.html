<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8F4FF">
<meta name="description" content="Peligros a la vista: conoce los peligros de tu puesto.">
<title>Peligros a la vista</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: un caso a la vez. Ilustración o pictograma arriba, escenario y 4 opciones debajo. Fase 1 transversal, elección de puesto, fase 2 específica, resultados. */
:root{
  --bg:#E8F5FF; --surface:#FFFFFF; --ink:#1B2A5B; --muted:#4A5B8C; --line:#C9DAF2;
  --go:#1E9E6A; --go-ink:#FFFFFF; --coral:#F2563F; --sun:#FFC845; --star-off:#C9D3E8; --track:#D3E1F5;
  --ok-bg:#D8F5E5; --ok-fg:#0B6B41; --no-bg:#FFE4DF; --no-fg:#A32B18; --focus:#1B2A5B;
  --in-bg:#FDE1DD; --in-fg:#9B1C12; --im-bg:#FEEBCB; --im-fg:#7A3D00; --mo-bg:#DDEBFF; --mo-fg:#134B9E; --tr-bg:#E6EAF0; --tr-fg:#44546A;
  --mis-bg:#1B2A5B; --mis-fg:#FFFFFF;
  --font:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A33; --surface:#17274C; --ink:#F1F5FF; --muted:#B6C4E6; --line:#2C4170; --track:#26396A;
  --go:#3CC88D; --go-ink:#04281A; --coral:#FF8A78; --sun:#FFD25E; --star-off:#41557F;
  --ok-bg:#12432E; --ok-fg:#9BEBC1; --no-bg:#4B2019; --no-fg:#FFB9AD; --focus:#FFD25E;
  --in-bg:#4A1712; --in-fg:#FFB4AC; --im-bg:#4A2D07; --im-fg:#FFD08A; --mo-bg:#14325F; --mo-fg:#A9CCFF; --tr-bg:#243248; --tr-fg:#B5C2D4; --mis-bg:#2F55B5; --mis-fg:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A33; --surface:#17274C; --ink:#F1F5FF; --muted:#B6C4E6; --line:#2C4170; --track:#26396A;
  --go:#3CC88D; --go-ink:#04281A; --coral:#FF8A78; --sun:#FFD25E; --star-off:#41557F;
  --ok-bg:#12432E; --ok-fg:#9BEBC1; --no-bg:#4B2019; --no-fg:#FFB9AD; --focus:#FFD25E;
  --in-bg:#4A1712; --in-fg:#FFB4AC; --im-bg:#4A2D07; --im-fg:#FFD08A; --mo-bg:#14325F; --mo-fg:#A9CCFF; --tr-bg:#243248; --tr-fg:#B5C2D4; --mis-bg:#2F55B5; --mis-fg:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:10px}
.wrap{max-width:780px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.logo{font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.logo svg{width:34px;height:34px;flex:none}
.stars{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:4px 14px;border:2px solid var(--line)}
.stars svg{width:22px;height:22px}
.prog{padding-block:2px 14px}
.prog-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.92rem;color:var(--muted);font-weight:500;margin-bottom:6px}
.track{height:12px;border-radius:99px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .3s}
h1{font-size:clamp(2.1rem,7vw,3rem);line-height:1.05;margin:0 0 12px;font-weight:700}
h2{font-size:1.5rem;line-height:1.2;margin:0 0 8px;font-weight:700}
h3{font-size:1.15rem;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
.card{background:var(--surface);border:3px solid var(--line);border-radius:26px;padding:20px}
.eyebrow{font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:6px}
.scene{border-radius:22px;overflow:hidden;border:3px solid var(--line);background:var(--surface);line-height:0}
.scene svg{width:100%;height:auto;display:block;touch-action:manipulation}
.scene.small svg{max-height:210px}
.hot{cursor:pointer;outline:none}
.hot .hit{fill:transparent;stroke:transparent;stroke-width:5;stroke-dasharray:10 7}
.hot:hover .hit{fill:rgba(255,255,255,.28);stroke:#fff}
.hot:focus-visible .hit{stroke:#1B2A5B}
.found .hit{fill:rgba(242,86,63,.15);stroke:#F2563F;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:9}}
.shake{animation:shake .5s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ask{margin-top:16px}
.ask .scen{font-size:1.15rem;font-weight:500}
.btn{font:inherit;font-weight:700;font-size:1.1rem;border:0;border-radius:18px;padding:13px 22px;cursor:pointer;background:var(--go);color:var(--go-ink);min-height:54px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.alt{background:var(--surface);color:var(--ink);border:3px solid var(--line);box-shadow:none}
.btn.round{min-height:48px;width:48px;padding:0;border-radius:50%;flex:none;display:grid;place-items:center;float:right;margin-left:10px}
.btn.round svg{width:24px;height:24px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{font:inherit;font-weight:500;font-size:1.05rem;text-align:left;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:14px 16px;cursor:pointer;min-height:58px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.good{background:var(--ok-bg);border-color:var(--ok-fg);color:var(--ok-fg)}
.opt.bad{background:var(--no-bg);border-color:var(--no-fg);color:var(--no-fg)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:18px;padding:14px 18px;font-weight:500}
.fb.ok{background:var(--ok-bg);color:var(--ok-fg)} .fb.no{background:var(--no-bg);color:var(--no-fg)}
.fb b{display:block;font-size:1.2rem}
.learn{margin-top:12px;background:var(--surface);border:3px dashed var(--line);border-radius:18px;padding:14px 16px}
.learn ul{margin:6px 0 0;padding-left:20px;display:grid;gap:3px}
.learn .q{margin-bottom:8px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:.9rem;color:var(--muted)}
.pill{display:inline-flex;font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.IN{background:var(--in-bg);color:var(--in-fg)} .pill.IM{background:var(--im-bg);color:var(--im-fg)} .pill.MO{background:var(--mo-bg);color:var(--mo-fg)} .pill.TO,.pill.TR{background:var(--tr-bg);color:var(--tr-fg)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
input[type=text]{font:inherit;font-size:1.2rem;padding:13px 16px;border-radius:16px;border:3px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:420px}
label{font-weight:600;display:block;margin-bottom:6px}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.ph{background:var(--bg);border-radius:18px;padding:14px 16px}
.ph b{display:block;font-size:2rem;line-height:1;color:var(--go)}
.ph span{font-size:.95rem;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;margin-top:14px}
.pk{font:inherit;text-align:left;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:12px 16px;cursor:pointer;min-height:64px}
.pk:hover{border-color:var(--ink)}
.pk b{display:block;font-weight:600}
.pk span{font-size:.88rem;color:var(--muted)}
.score{font-size:3.4rem;font-weight:700;line-height:1;color:var(--go)}
.bars{display:grid;gap:10px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:10px;align-items:center;font-size:.95rem}
.bar .tr{height:14px;border-radius:99px;background:var(--track);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--go)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.kp div{background:var(--bg);border-radius:16px;padding:10px 14px}
.kp b{display:block;font-size:1.7rem;line-height:1.1}
.kp span{font-size:.85rem;color:var(--muted)}
details{margin-top:10px;font-size:1rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ink)}
details ul{margin:8px 0 0;padding-left:20px}
.hl{display:grid;gap:8px;margin-top:12px}
.hl>div{background:var(--bg);border-radius:16px;padding:10px 14px}
.hl .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
@media (prefers-reduced-motion:reduce){.found .hit,.shake{animation:none}.track i{transition:none}}

.hr{display:flex;gap:8px;align-items:center}
.snd{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.snd svg{width:22px;height:22px}
.mission{display:flex;gap:14px;align-items:center;background:var(--mis-bg);color:var(--mis-fg);border-radius:20px;padding:14px 18px;margin:0 0 14px;box-shadow:0 6px 0 rgba(0,0,0,.14);animation:pop .5s}
.mission .mi{flex:none;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.mission .mi svg{width:26px;height:26px}
.mission small{display:block;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.88}
.mission b{display:block;font-size:1.3rem;line-height:1.25;font-weight:600}
@keyframes pop{0%{transform:scale(.97);opacity:.4}100%{transform:none;opacity:1}}
.situ{background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:14px 18px;margin:14px 0;overflow:hidden}
.situ .scen{font-size:1.15rem;font-weight:500;margin:0}
.situ .eyebrow{margin-bottom:4px}
.opts{margin-top:0}
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(8,16,36,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{position:relative;background:var(--surface);color:var(--ink);border-radius:26px;border:3px solid var(--line);padding:22px;max-width:560px;width:100%;max-height:100%;overflow:auto;animation:pop .3s;line-height:1.45}
.modal .mok{font-size:1.4rem;font-weight:700;color:var(--ok-fg);background:var(--ok-bg);display:inline-block;padding:4px 14px;border-radius:14px;margin:0 52px 12px 0}
.mx{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.6rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.path{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.path li{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--bg);opacity:.75;border:3px solid transparent}
.path li.cur{opacity:1;border-color:var(--go);background:var(--surface)}
.path li.done{opacity:1}
.path .dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.path li.done .dot{background:var(--go);color:var(--go-ink)}
.path li.cur .dot{background:var(--ink);color:var(--surface)}
.path b{display:block;font-weight:600}
.path li span:not(.dot){font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.mission,.modal,.celebrate{animation:none}}

.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.himg{flex:0 0 150px;width:150px;aspect-ratio:1;border-radius:24px;display:grid;place-items:center;border:3px solid var(--line)}
.himg svg{width:82%;height:auto}
.htx{flex:1 1 260px;min-width:0}
.htx p{margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tl{position:relative;background:var(--surface);border:3px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tl .img{aspect-ratio:4/3;display:grid;place-items:center}
.tl .img svg{width:58%;height:auto;max-height:86%}
.tl .tx{padding:10px 12px 12px}
.tl b{display:block;font-size:.98rem;line-height:1.2;font-weight:600}
.tl small{color:var(--muted);font-size:.85rem}
.tl.cur{border-color:var(--go)}
.tl:not(.cur):not(.done){opacity:.78}
.tl .st{position:absolute;top:8px;right:8px;min-width:30px;height:30px;padding:0 9px;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.tl .st.ok{background:var(--go);color:var(--go-ink);border-color:var(--go)}
.tl .st.now{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.navrow{display:flex;justify-content:space-between;gap:10px;margin:0 0 14px}
.nv{font:inherit;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:42px}
.nv svg{width:18px;height:18px}
.nv:hover{border-color:var(--ink)}
.btn.phase{background:var(--mis-bg);color:var(--mis-fg);font-size:1.15rem;padding:15px 24px}
.phasecard{margin-top:16px;border-radius:26px;padding:22px;background:var(--mis-bg);color:var(--mis-fg);box-shadow:0 8px 0 rgba(0,0,0,.14)}
.phasecard h2{margin-bottom:6px}
.phasecard p{opacity:.95}
.phasecard .ptag{display:inline-block;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;background:var(--sun);color:#1B2A5B;padding:4px 12px;border-radius:99px;margin-bottom:10px}
.phasecard .btn.phase{background:var(--go);color:var(--go-ink)}
.celebrate{border-color:var(--go);box-shadow:0 10px 0 rgba(30,158,106,.16);animation:celebrate-in .55s ease-out}
.celebrate .himg{background:var(--ok-bg)!important;border-color:var(--go)}
.celebrate .score{color:var(--go)}
.save-note{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--ok-bg);color:var(--ok-fg);font-weight:600;font-size:.95rem}
.save-note svg{width:22px;height:22px;flex:none}
.celebrate .row{margin-top:16px}
@keyframes celebrate-in{0%{transform:translateY(10px) scale(.98);opacity:.3}100%{transform:none;opacity:1}}
.tl.p2{border-style:dashed;border-color:var(--mis-bg);opacity:1}
.tl .st.f2{background:var(--mis-bg);color:var(--mis-fg);border-color:var(--mis-bg)}
.scale{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scale .arr{color:var(--muted);font-weight:700}
.scale .sc-note{flex-basis:100%;font-size:.85rem;color:var(--muted)}
.pill{font-size:.9rem;padding:4px 12px}
.opts.duel{grid-template-columns:1fr 1fr}
.opts.duel .opt{display:flex;flex-direction:column;gap:8px;min-height:120px;justify-content:center;text-align:center;align-items:center;font-size:1.2rem;font-weight:600}
.ltr{width:36px;height:36px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-weight:700}
.vsr{display:grid;gap:8px;margin:10px 0}
.vsr>div{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:10px 14px}
@media (max-width:480px){.scale{gap:4px}.scale .pill{font-size:.76rem;padding:3px 7px}.modal{padding:20px 18px 26px}.modal .btn{margin-bottom:4px}.opts.duel{grid-template-columns:1fr}.opts.duel .opt{min-height:80px;flex-direction:row;text-align:left}}

.lead{font-size:1.2rem;color:var(--muted);margin:0 0 18px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px}
.how>div{background:var(--bg);border-radius:20px;padding:14px 8px;text-align:center}
.how .hi{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--mis-bg);color:var(--mis-fg);margin:0 auto 8px}
.how .hi svg{width:28px;height:28px}
.how b{display:block;font-size:1.05rem;line-height:1.1}
.how small{display:block;color:var(--muted);font-size:.9rem}
.fld{margin:10px 0}.fld label{display:block;font-weight:700;margin-bottom:6px}.ferr{color:var(--in-fg);background:var(--in-bg);font-weight:700;padding:8px 14px;border-radius:12px;margin:8px 0}.dnil{color:var(--muted);font-size:.9rem;margin-top:2px}
</style>

<body>

<div class="wrap">
<header>
  <div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#1B2A5B"/><path d="M8 23a12 12 0 0 1 24 0z" fill="#FFC845"/><rect x="6" y="23" width="28" height="4" rx="2" fill="#FFC845"/><rect x="18" y="9" width="4" height="9" rx="2" fill="#F2563F"/><circle cx="20" cy="30" r="4" fill="#fff"/></svg>Peligros a la vista</div>
  <div class="hr"><button class="snd" id="snd" aria-pressed="true" aria-label="Sonido activado"></button><div class="stars" id="starsbox" aria-live="polite"></div></div>
</header>
<div class="prog" id="prog" hidden><div class="prog-top"><span id="plabel"></span><span id="pcount"></span></div><div class="track" aria-hidden="true"><i id="pfill"></i></div></div>

<main id="main" tabindex="-1"></main>

const QA={
"Piso mojado":["Limpieza trapeó el pasillo y la señal de piso mojado ya no está. Debes cruzar con una carpeta en cada mano.","Esperar a que seque o rodear por una zona seca, y avisar que falta la señal.",["Cruzar con pasos cortos; el piso se seca solo.","Pasar pegado a la pared, donde hay menos agua.","Cruzar rápido para reducir el tiempo de exposición."],"La caída al mismo nivel se controla con orden y limpieza, y con autocuidado. Una señal faltante también es una condición que se reporta."],
"Golpes con el mobiliario":["Sales apurado de una reunión con la laptop en la mano y hay una silla fuera de lugar junto a la esquina del escritorio.","Mantener sillas y cajoneras ordenadas, y moverte atento al espacio.",["Usar calzado cerrado para que los golpes duelan menos.","Evitar levantarte durante las reuniones.","Esperar a que alguien más ordene el espacio."],"El acto inseguro registrado es no atender las condiciones del puesto. Se controla con orden y capacitación en autocuidado."],
"Escaleras":["Bajas a una reunión con el celular en una mano y una carpeta en la otra.","Guardar el celular, dejar una mano libre y usar los tres apoyos con el pasamanos.",["Bajar rápido para pasar menos tiempo en la escalera.","Mirar la pantalla y avanzar despacio.","Usar el pasamanos solo en los tramos largos."],"El control del IPERC es la capacitación en uso y manejo de escaleras con tres apoyos."],
"Archivadores":["El cajón del archivador está lleno y las carpetas se atascan. Tiras con fuerza.","Abrir un cajón a la vez, sacar las carpetas con control y reordenar el cajón.",["Tirar más fuerte para destrabar.","Abrir varios cajones para ver cuál se atasca.","Dejar el cajón abierto para no repetir el esfuerzo."],"El riesgo es un golpe por carpetas que salen de golpe, en ojos o cara. El control es la capacitación en orden y almacenaje."],
"Conexiones eléctricas":["En tu puesto hay un tomacorriente con agua cerca y un cable pelado.","No tocarlo, mantener distancia y avisar a mantenimiento para que lo desenergicen.",["Secar el agua con papel y seguir usándolo.","Pasar el cargador a otro enchufe y dejar el pelado.","Cubrir el cable con cinta y continuar."],"Nivel Intolerable. El circuito debe cumplir la NTP 370.053 y los alargadores deben quedar fuera del alcance y contacto de las personas."],
"Presión de entrega":["Tienes tres entregas el mismo día y hace una semana duermes mal y sientes tensión constante.","Priorizar, avisar a tu jefatura a tiempo que los plazos no son realistas y hacer pausas.",["Quedarte hasta tarde cada día hasta terminar.","Entregar todo a medias para cumplir los plazos.","No decir nada para no mostrar debilidad."],"Es un riesgo psicosocial. El control del IPERC es la capacitación en riesgos psicosociales y sus cuidados."],
"Iluminación insuficiente":["Las luminarias de tu zona están fundidas y empiezas a entrecerrar los ojos para leer.","Reportar para reemplazar las luminarias y cumplir tu examen periódico de agudeza visual.",["Subir el brillo de la pantalla al máximo.","Acercarte más a los documentos.","Trabajar solo con la luz de la pantalla."],"El control incluye mantenimiento de luminarias, monitoreo de iluminación y examen periódico de agudeza visual (RM 375-2008-TR)."],
"Postura forzada frente al PC":["Trabajas toda la mañana con la laptop sobre las piernas y sientes molestias en el cuello.","Usar escritorio y silla ajustable, con el monitor a la altura de los ojos, y hacer pausas activas.",["Poner un cojín bajo la laptop y seguir igual.","Inclinarte hacia la pantalla para ver mejor.","Cambiar la laptop de pierna cada hora."],"El control es ajustar silla, teclado y monitor, apoyar la espalda y hacer pausas activas."],
"Radiación de pantallas":["Pasas muchas horas frente a pantallas y te preocupa la radiación electromagnética.","Mantener distancia adecuada, usar pantallas de baja radiación y descansar con regularidad.",["Cubrir el monitor con un protector mate.","Apagar el monitor y dejar la CPU encendida.","Bajar el volumen de los parlantes."],"En el IPERC esta exposición se controla con equipos de baja radiación, distancia y pausas."],
"Movimientos repetitivos":["Tras horas de mouse y teclado te hormiguean los dedos de la mano.","Usar mouse y teclado ergonómicos, estirar y descansar las manos con regularidad.",["Seguir hasta terminar y descansar el fin de semana.","Apretar más el mouse para tener control.","Cambiar a la otra mano sin pausas ni ajustes."],"El riesgo es tendinitis y síndrome del túnel carpiano. Se controla con dispositivos ergonómicos y pausas regulares."],
"Pantalla demasiado cerca":["Terminas el día con ojos secos y dolor ocular. Sueles trabajar a unos 20 cm de la pantalla.","Alejarte a una distancia cómoda, parpadear y descansar la vista mirando lejos con regularidad.",["Aumentar el tamaño de letra y quedarte igual de cerca.","Usar gotas oculares y seguir igual.","Bajar la luz de la sala."],"Es fatiga visual. El control es mantener una distancia adecuada y hacer pausas para descansar los ojos."],
"Sismo":["Suena la alarma de sismo mientras estás en una reunión con visitantes.","Mantener la calma, guiar a los visitantes por la ruta de evacuación y dirigirse a la zona segura.",["Terminar la reunión primero; los sismos duran poco.","Usar el ascensor para salir más rápido.","Esperar en tu lugar a que llegue seguridad."],"Nivel Intolerable. El acto inseguro registrado es no evacuar. Los controles son las alarmas de evacuación y los simulacros."],
"Incendio":["Huele a humo en el pasillo y aún no suena la alarma.","Activar la alarma, evacuar por la ruta señalizada y no usar el ascensor.",["Buscar el foco y apagarlo tú solo.","Esperar confirmación para no generar pánico.","Cerrar la puerta de tu oficina y seguir trabajando."],"Nivel Intolerable. Los controles son equipos de emergencia en buen estado, plan de contingencia y simulacros periódicos."],
"Ergonomía en casa":["Trabajas desde el sofá con la laptop y te duele la espalda al final del día.","Armar un puesto con mesa, silla ajustable, pantalla a la altura de los ojos y pausas.",["Poner un cojín bajo la laptop.","Alternar entre el sofá y la cama.","Trabajar de pie todo el día."],"El IPERC pide configurar un espacio ergonómico en casa con silla ajustable y postura adecuada (Ley 31572)."],
"Aislamiento":["Llevas semanas en remoto y notas desgano y poco contacto con el equipo.","Mantener comunicación regular con colegas y jefatura, y participar en las actividades virtuales.",["Mantener la cámara apagada para no distraerte.","Responder solo lo indispensable.","Dejar los chats para el final del día."],"El aislamiento social es un riesgo psicosocial del teletrabajo. El control es la comunicación regular y la participación en actividades del equipo."],
"Sedentarismo":["Pasas ocho horas sentado frente a la laptop sin levantarte.","Programar pausas activas durante el día y mantener una rutina regular de actividad física.",["Compensar con ejercicio intenso el fin de semana.","Tomar café para mantenerte activo.","Sentarte más recto y no levantarte."],"El control es realizar pausas activas y ejercicio durante el día, con una rutina regular."],
"Incendio y electricidad en casa":["Conectas laptop, monitor, impresora y cargadores a un solo enchufe de la pared con adaptadores.","Usar regleta con protección, no sobrecargar enchufes y tener extintor y detector de humo.",["Cubrir los adaptadores con cinta aislante.","Poner los adaptadores en cascada.","Desconectar solo la impresora cuando sales."],"En casa también aplica: extintor y detectores de humo, equipos y cables en buen estado, y sin sobrecarga de enchufes."],
"Electrocución en la kitchenette":["La tetera chisporrotea al conectarla y hay un charco junto a la regleta.","Alejarte del charco, no usar el equipo y avisar a mantenimiento.",["Secar el charco y seguir usando la tetera.","Pasarla a otra regleta del mismo mueble.","Enchufarla y alejarte hasta que hierva."],"Nivel Intolerable en los 16 puestos. Se controla con enchufes y cables en buen estado, sin sobrecarga y lejos de líquidos y de fuentes de calor."],
"Intoxicación alimentaria":["Un táper lleva tres días en el refrigerador compartido. Huele raro, pero se ve bien.","Descartarlo y mantener limpios el refrigerador y los utensilios.",["Calentarlo bien en el microondas.","Probar un poco para decidir.","Dejarlo; seguro es de otra persona."],"El control es higiene personal, limpieza de superficies y utensilios, y almacenamiento adecuado de alimentos."],
"Resbalones en la kitchenette":["Se derramó café frente a la cafetera y el tapete se arrugó.","Secar de inmediato, estirar el tapete antideslizante y mantener los cables fuera del paso.",["Poner una servilleta encima y seguir.","Pasar por el borde, donde no llegó el café.","Esperar a que el personal de limpieza lo haga."],"El control es mantener el suelo limpio y seco, usar tapetes antideslizantes y asegurar los cables."],
"Quemaduras":["Debes mover una olla recién retirada del fuego.","Usar agarraderas o guantes, con el camino despejado.",["Agarrarla con un trapo húmedo.","Agarrarla rápido por el asa.","Esperar y tocarla de vez en cuando para ver si enfría."],"El control es usar agarraderas y guantes con objetos calientes y ajustar la temperatura de los equipos. Un trapo húmedo transmite el calor."],
"Accidentes de tránsito en la ciudad":["Pides un taxi por aplicación y llega un vehículo y un conductor distintos a los que muestra la app.","No subir; usar solo empresas y conductores formales o autorizados, y siempre el cinturón.",["Subir si ofrece menor tarifa.","Subir y compartir tu ubicación con alguien.","Subir y sentarte atrás sin cinturón."],"Nivel Intolerable. Los controles son empresas y conductores formales o autorizados, cumplir las normas de tránsito y usar cinturón."],
"Atropellos":["Debes cruzar una avenida con poco tráfico, a media cuadra del paso peatonal.","Caminar hasta el paso peatonal y cruzar atento, sin mirar el celular.",["Cruzar por el medio mirando solo hacia la izquierda.","Cruzar corriendo porque hay poco tráfico.","Cruzar detrás de otro peatón."],"Los controles son respetar señales, cruzar por lugares designados y prestar atención al entorno."],
"Robos y asaltos":["Sales de una reunión de noche y la app te propone caminar por una calle poco iluminada.","Evitar zonas solitarias y poco iluminadas, guardar objetos de valor y pedir transporte formal.",["Caminar con auriculares para no mirar.","Mostrar el celular para seguir el mapa.","Apurar el paso y cruzar por el centro de la calle."],"Los controles son evitar áreas peligrosas, mantener objetos de valor fuera de la vista y no transitar por lugares solitarios."],
"Accidentes en carretera":["Debes viajar a otra ciudad. El pasaje con una empresa informal es más barato y sale antes.","Viajar con empresa y conductor formales o autorizados, y con el cinturón puesto.",["Aceptar y avisar a tu jefatura para que quede registrado.","Viajar de noche para evitar tráfico.","Compartir un taxi con otros pasajeros."],"Nivel Intolerable. El control es contratar empresas y conductores formales o autorizados y cumplir las normas de tránsito."],
"Atropellos en ruta":["El bus te deja en un paradero de carretera sin paso peatonal.","Esperar a que el bus se aleje, mirar ambos lados y cruzar donde haya visibilidad.",["Cruzar por delante del bus para ganar tiempo.","Cruzar mirando el celular para ubicar el hotel.","Seguir a otro peatón."],"El riesgo es de fracturas, heridas y muerte. El control es prestar atención al entorno y respetar la señalización."],
"Robos y asaltos en ruta":["En una parada del viaje ves un terminal casi vacío y tus pertenencias en el asiento.","Evitar zonas peligrosas, no exhibir objetos de valor y mantener puertas con seguro.",["Dejar la laptop a la vista en el asiento.","Alejarte del terminal para buscar un local más barato.","Dejar a una persona desconocida cuidando tus cosas."],"Intolerable. Los controles son evitar áreas peligrosas, mantener objetos de valor fuera de la vista y cerrar las puertas con llave."],
"Manifestaciones y protestas":["Tu ruta pasa por una ciudad con una marcha anunciada.","Buscar vías alternativas y mantenerte alejado de enfrentamientos.",["Pasar rápido por el centro.","Detenerte a grabar.","Bajar del vehículo para ver qué ocurre."],"El control es mantenerse alejado de enfrentamientos y buscar vías alternativas para evitar el área."],
"Gases lacrimógenos":["Tu vehículo se acerca a una zona donde dispersan una protesta con gases.","Mantener las ventanas cerradas, usar la ventilación interna y retirarte de la zona.",["Bajar las ventanas para respirar aire fresco.","Detenerte y esperar con el motor apagado.","Taparte la boca con la mano y seguir."],"El control es ventanas cerradas y ventilación interna o aire acondicionado del vehículo."],
"Estrés ante una manifestación":["Quedas bloqueado por una protesta y empiezas a sentir angustia.","Mantener la calma y aplicar el plan de acción que conoces para estas situaciones.",["Intentar avanzar entre la multitud.","Bajar y negociar con los manifestantes.","Apagar el celular para no recibir noticias."],"El IPERC pide mantener la calma, ser consciente de las emociones y conocer el plan de acción."],
"Presión en los oídos":["Durante el descenso sientes dolor fuerte en los oídos.","Bostezar o chupar un caramelo, y si lo necesitas usar tapones.",["Aguantar sin hacer nada hasta aterrizar.","Subir el volumen de los audífonos.","Tomar un analgésico antes de despegar."],"El control del IPERC es chupar caramelos o bostezar durante el despegue y el aterrizaje, y opcionalmente usar tapones."],
"Accidente de aviación":["Estás por despegar y empieza la demostración de seguridad.","Atender las instrucciones del personal de vuelo y ubicar la salida más cercana.",["Ignorarla; ya la escuchaste antes.","Dejar el cinturón flojo para estar cómodo.","Poner el equipaje junto a la salida de emergencia."],"Nivel Intolerable. El control es cumplir las normas de la aerolínea y seguir las instrucciones del personal de vuelo."],
"Turbulencia":["Se enciende la señal del cinturón por turbulencia y quieres ir al baño.","Permanecer sentado con el cinturón abrochado y seguir al personal de vuelo.",["Ir rápido antes de que aumente.","Sujetarte de los asientos al caminar.","Pararte a sacar algo del compartimiento."],"El riesgo son caídas y fracturas en cabina. El control es mantener el cinturón abrochado durante el vuelo."],
"COVID-19":["Un compañero tose y tiene fiebre, pero quiere quedarse porque tiene una entrega.","Que reporte síntomas a su jefatura, siga el plan de vigilancia y se ventile el ambiente.",["Que se quede con mascarilla y sin avisar.","Cerrar la sala para que no se enfríe.","Esperar a que otros presenten síntomas."],"El IPERC mantiene ventilación, esquema de vacunación, reporte a la jefatura y el plan de vigilancia, prevención y control."],
"Resbalones en el muelle":["El muelle amaneció húmedo y el tramo hacia el bote no tiene baranda continua.","Usar calzado antideslizante, apoyarte en las barandas y conocer los riesgos de la instalación.",["Caminar rápido con las manos en los bolsillos.","Usar zapatos de cuero, que son firmes.","Caminar por el borde, donde la madera se ve más seca."],"Nivel Intolerable. Los controles son barandas, conocimiento de los riesgos de las instalaciones y calzado antideslizante."],
"Ahogamiento":["Debes acercarte al borde para recibir a un colega que llega en bote.","Mantener distancia segura del borde y usar chaleco salvavidas en áreas peligrosas.",["Acercarte con cuidado sin chaleco, porque sabes nadar.","Usar chaleco solo si el mar está agitado.","Pedir que alguien te sujete de la ropa."],"Nivel Intolerable. Los controles son distancia segura del borde, normas de seguridad y chaleco salvavidas."],
"Clima adverso":["Se anuncia viento fuerte y neblina cuando visitas el muelle.","Revisar las advertencias, vestir ropa adecuada y ubicar un refugio o zona de resguardo.",["Continuar con tu agenda; el clima cambia rápido.","Quedarte en el borde para ver el cambio.","Cubrirte con la chaqueta y seguir."],"El control es seguir las recomendaciones meteorológicas, usar ropa adecuada y tener un refugio en caso de tormentas."],
"Radiación solar":["Estarás cuatro horas a la intemperie en el muelle.","Aplicar protector solar, usar lentes y sombrero, y reaplicar durante la jornada.",["Aplicar protector una sola vez por la mañana.","Usar solo lentes de sol.","Evitar el protector para no sentir la piel grasosa."],"El IPERC pide sensibilización en radiación UV y uso de protector solar. El daño es ocular y envejecimiento prematuro de la piel."],
"Radiación solar en espacios públicos":["Participas en una jornada de limpieza de playa de 9 a 14 h.","Protector solar reaplicado, sombrero, lentes, hidratación y pausas a la sombra.",["Hidratarte y listo.","Hacer la jornada en la hora de mayor sol para terminar antes.","Usar manga corta para estar fresco."],"El control es la sensibilización en radiación UV y el uso de protectores solares."],
"Robos y asaltos en la actividad":["En una jornada de limpieza en un lugar apartado, un grupo desconocido se acerca a las pertenencias del equipo.","Coordinar la presencia de la autoridad local, evitar lugares solitarios y dejar objetos de valor fuera de la vista.",["Dejar las mochilas juntas y vigilar de lejos.","Dejar las mochilas en el vehículo a la vista.","Enfrentar al grupo."],"Intolerable. El control incluye evitar lugares solitarios o poco iluminados y gestionar la permanencia de control por la autoridad local."],
"Intoxicación alimentaria en campo":["El almuerzo de la jornada lo ofrece un vendedor ambulante a mitad de precio.","Preferir proveedores formales y mantener higiene de manos y utensilios.",["Aceptar si otro compañero ya comió.","Comer solo lo que se vea bien cocido.","Comer rápido para que no se enfríe."],"El control del IPERC es higiene personal, limpieza de superficies y utensilios, y uso de proveedores formales."],
"Objetos punzocortantes":["Encuentras vidrios y una jeringa entre los residuos de la playa.","Usar pinzas, guantes anticorte y calzado cerrado, y depositar en contenedores rígidos rotulados.",["Recogerlos con guantes comunes y bolsa plástica.","Taparlos con arena y seguir.","Agruparlos con la mano en una bolsa doble."],"Los controles incluyen pinzas o tenazas, contenedores rígidos, vacunación vigente (tétanos, hepatitis A y B) y botiquín disponible."],
"Productos químicos":["Debes limpiar con un desinfectante nuevo en un baño sin ventilación.","Leer la etiqueta, ventilar el área y usar guantes y mascarilla.",["Mezclarlo con lejía para que limpie más.","Usar solo guantes y no ventilar.","Dosificar a ojo."],"Los controles son almacenar y manipular de forma segura, ventilar, seguir las instrucciones de la etiqueta y usar EPP."],
"Caídas y resbalones al limpiar":["Terminas de trapear un pasillo y debes limpiar una luminaria en altura.","Señalizar el piso mojado, usar calzado antideslizante y una escalera asegurada.",["Apoyar la escalera sobre una silla.","Subirte a una mesa.","Dejar la señal para el final."],"Los controles son mantener el piso limpio y seco, señales de advertencia, asegurar escaleras y calzado antideslizante."],
"Cortes y pinchazos":["En una papelera hay un objeto filoso entre los papeles.","Usar herramientas adecuadas y guantes resistentes al corte, y desechar en el recipiente correcto.",["Presionar la bolsa con la mano para compactar.","Apartarlo con el pie.","Sacarlo con la mano sin guantes."],"El riesgo son heridas e infecciones. El control es herramientas adecuadas, guantes y desecho correcto."],
"Sobreesfuerzo y posturas":["Debes mover un balde con agua y un tacho de basura grande, ambos llenos.","Usar técnica de levantamiento seguro, dividir la carga o pedir ayuda, y alternar posturas.",["Cargar los dos a la vez para ahorrar viajes.","Doblar la espalda para ahorrar tiempo.","Arrastrar el tacho por el piso."],"El control es técnicas de levantamiento seguro, pedir ayuda con objetos pesados y entrenamiento en manejo manual de cargas."],
"Contaminación biológica":["Debes limpiar un baño con restos de fluidos corporales.","Seguir procedimientos de higiene, usar desinfectantes efectivos y guantes.",["Limpiar con el mop común y agua.","Usar el mismo trapo en toda la oficina.","Limpiar sin guantes y lavarte las manos después."],"Los controles son procedimientos de higiene, desinfectantes efectivos, capacitación en residuos biológicos y EPP."],
"Polvo y alérgenos":["Debes limpiar una oficina con mucho polvo y tu nariz empieza a irritarse.","Aplicar limpieza en seco que no disperse polvo, ventilar y usar mascarilla o respirador.",["Barrer en seco con movimientos rápidos.","Cerrar las ventanas para que el polvo no salga.","Sacudir con un plumero."],"El IPERC pide procedimientos de limpieza en seco para evitar la dispersión de polvo, buena ventilación y mascarilla."],
"Limpieza en solitario":["Limpias sola un piso de oficinas fuera del horario normal.","Cumplir el protocolo de confirmaciones intermedias y mantener la ficha médica actualizada.",["Avisar solo si terminas más tarde de lo previsto.","Llevar el celular y nada más.","Trabajar más rápido para salir antes."],"Intolerable: una demora en el auxilio agrava la lesión. Los controles son el protocolo de confirmaciones, la ficha médica y la capacitación en señales de alarma."]

  <h3 style="margin-top:14px">Por sección</h3><div class="bars">${bars}</div></div>
  <div class="card" style="margin-top:14px"><h2>Los peligros de tu puesto</h2>
  <div class="kp"><div><b>${its.length}</b><span>peligros en total</span></div><div><b>${cnt("IN")}</b><span>Muy graves</span></div><div><b>${cnt("IM")}</b><span>Graves</span></div><div><b>${its.length-cnt("IN")-cnt("IM")}</b><span>Otros</span></div></div>
  <p style="margin-top:12px;color:var(--muted)">${gen} de tus peligros son transversales y ${its.length-gen} son por grupo o propios de tu puesto.${N1-gen>0?" Hay "+(N1-gen)+" peligros transversales del juego que no figuran en tu matriz.":""}</p>
  <h3>Los más graves de tu puesto</h3><div class="hl">${intol.map(x=>`<div><div class="t">${esc(x.h.t)} ${pill("IN")}</div><details><summary>Ver controles</summary><ul>${x.h.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></details></div>`).join("")}</div></div>
  <div class="row"><button class="btn alt" id="change">Probar otro puesto</button><button class="btn" id="terminar">Terminar</button></div>`;
}

/* ---- Guardado de avance (localStorage, un registro por DNI) ---- */
const SKEY="detectives-seguridad:v1:", LAST="detectives-seguridad:ultimo";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function saveProgress(){
  if(S.admin||!S.dni||!S.name||!S.secs.length) return;
  let view=S.view;
  if(view==="start"){ if(!S.resume) return; view=S.resume; }
  const snap={v:1,t:Date.now(),name:S.name,dni:S.dni,pts:S.pts,phase:S.phase,si:S.si,qi:S.qi,view,log:S.log,hist:S.hist,stageSeen:S.stageSeen,
    secs:S.secs,secs1:S.phase===1?null:S.secs1,p1len:S.p1len,p1pts:S.p1pts,secLog:S.secLog,
    pi:S.puesto?P.indexOf(S.puesto):-1,pn:S.puesto?S.puesto.name:null,snd:SND,completed:S.completed};
  if(lsSet(SKEY+S.dni,JSON.stringify(snap))) lsSet(LAST,S.dni);
  if(window._onSaveProgress) window._onSaveProgress(snap);
}
function readSave(dni){
  const raw=lsGet(SKEY+dni); if(!raw) return null;
  try{ const d=JSON.parse(raw); return d&&d.v===1&&d.dni===dni&&Array.isArray(d.secs)?d:null; }catch(e){ return null; }
}
function applySave(d){
  S.name=d.name; S.dni=d.dni; S.pts=d.pts; S.phase=d.phase; S.si=d.si; S.qi=d.qi; S.log=d.log; S.hist=d.hist;
  S.secs=d.secs; S.secs1=d.phase===1?d.secs:d.secs1; S.p1len=d.p1len; S.p1pts=d.p1pts; S.secLog=d.secLog;
  S.puesto=d.pi>=0?P[d.pi]:null; S.stageSeen=d.stageSeen||null; if(typeof d.snd==="boolean") SND=d.snd;
  S.modal=false; S.fresh=false; S.completed=!!d.completed;
  if(d.view==="play") newCase();
  S.view=d.view; S.resume=null;
  if(window._onApplySave) window._onApplySave(d);
}
function continueFromSave(d){
  applySave(d);
  if(d.completed){ S.view="intro"; return; }
  if(d.view==="result") return;
  if(d.view==="summary"){
    if(S.si<S.secs.length-1){ S.si++; S.qi=0; S.view="intro"; }
    else if(S.phase===1){ S.view="pick"; }
    else S.view="result";
    return;
  }
  S.view="intro";
}
function goToFichas(){
  S.modal=false;
  S.resume=null;
  S.fresh=false;
  if(S.view==="summary"){
    if(S.si<S.secs.length-1){ S.si++; S.qi=0; S.view="intro"; }
    else if(S.phase===1) S.view="pick";
    else S.view="result";
    return;
  }
  if(S.view!=="intro"&&S.view!=="pick"&&S.view!=="result") S.view="intro";
}
(function(){ const last=lsGet(LAST); const d=last&&readSave(last); if(d){ S.name=d.name; S.dni=d.dni; S.resume={saved:d}; } })();
function render(){
  const m=$("#main");
  m.innerHTML=S.view==="start"?startView():S.view==="intro"?introView():S.view==="play"?caseView():S.view==="summary"?summaryView():S.view==="pick"?pickView():resultView();
  headUpdate(); bind(); saveProgress();
}
function closeModal(){ S.modal=false; render(); const n=$("#nx"); if(n) n.focus(); }
function bind(){
  const g=$("#go"); if(g) g.onclick=()=>{
    const dv=($("#dni").value||"").trim(), er=$("#ferr");
    const bad=(m)=>{er.textContent=m; er.hidden=false; $("#dni").focus();};
    er.hidden=true;
    if(!/^\d{8}$/.test(dv)) return bad("Escribe tu DNI de 8 números.");
    const enterGame=(nombre)=>{
      S.name=nombre; S.dni=dv;
      if(!S.fresh){ const sv=readSave(dv); if(sv){ if(sv.name!==nombre) sv.name=nombre; continueFromSave(sv); render(); window.scrollTo({top:0}); return; } }
      const startNew=()=>{S.pts=0; S.log=[]; S.phase=1; S.puesto=null; S.hist={}; S.resume=null; S.fresh=false; S.completed=false; S.stageSeen=progressStage(0); S.secs=SEC1.map(s=>({title:s.title,sub:s.sub,ic:s.ic,cases:s.ids.map(hid=>({t:"haz",hid}))})); S.secs1=S.secs; S.si=0; S.qi=0; S.view="intro"; render(); window.scrollTo({top:0});};
      if(S.fresh){ startNew(); return; }
      if(window._checkRemoteSave){ (async()=>{ const rs=await window._checkRemoteSave(dv); if(rs){ if(rs.name!==nombre) rs.name=nombre; try{localStorage.setItem(SKEY+dv,JSON.stringify(rs)); localStorage.setItem(LAST,dv);}catch(e){} continueFromSave(rs); render(); window.scrollTo({top:0}); return; } startNew(); })(); }
      else startNew();
    };
    if(dv===ADMIN_DNI){ S.admin=true; S.adminData=null; S.adminMsg=null; S.adminErr=null; render(); window.scrollTo({top:0}); if(window._lookupDni) loadAdminData(); return; }
    if(window._lookupDni){ (async()=>{ const p=await window._lookupDni(dv); if(!p||!p.nombre) return bad("No estás registrado. Contacta con quien administra el juego."); enterGame(p.nombre); })(); }
    else { const sv=readSave(dv); if(sv) enterGame(sv.name); else bad("No estás registrado. Contacta con quien administra el juego."); }
  };
  const fr=$("#fresh"); if(fr) fr.onclick=()=>{S.fresh=true; render();};
  const ct=$("#cont"); if(ct) ct.onclick=()=>{ if(S.resume&&S.resume.saved){ applySave(S.resume.saved); } else { S.view=S.resume; S.resume=null; if(S.view==="play") newCase(); } render(); window.scrollTo({top:0});};
  const dn=$("#dni"); if(dn) dn.onkeydown=e=>{if(e.key==="Enter"&&g) g.click();};
  if(dn) dn.oninput=()=>{dn.value=dn.value.replace(/\D/g,"").slice(0,8);};
  const abx=$("#adminExit"); if(abx) abx.onclick=()=>{S.admin=false; S.adminData=null; S.adminMsg=null; S.adminErr=null; S.view="start"; render(); window.scrollTo({top:0});};
  const arl=$("#adminReload"); if(arl) arl.onclick=()=>{ loadAdminData(); };
  const aav=$("#adminAdd"); if(aav) aav.onclick=()=>{ adminAddOne(); };
  const abl=$("#adminBulk"); if(abl) abl.onclick=()=>{ adminAddBulk(); };
  const bg=$("#begin"); if(bg) bg.onclick=()=>{S.qi=0; S.secLog=S.log.length; newCase(); S.view="play"; render(); window.scrollTo({top:0});};
  const sn=$("#secnow"); if(sn) sn.onclick=()=>{
    if(S.si<S.secs.length-1){S.si++; S.view="intro";}
    else if(S.phase===1){S.p1len=S.log.length; S.p1pts=S.pts; S.view="pick";}
    else S.view="result";
    render(); window.scrollTo({top:0});};
  document.querySelectorAll(".hot").forEach(h=>{ const act=()=>tapHot(h); h.addEventListener("click",act); h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}}); });
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>tapOpt(+b.dataset.k));
  const nx=$("#nx"); if(nx) nx.onclick=next;
  const ro=$("#reopen"); if(ro) ro.onclick=()=>{S.modal=true; render();};
  const mc=$("#mclose"), mt=$("#mcont"), mb=$("#mbg");
  if(mc) mc.onclick=closeModal; if(mt) mt.onclick=continueCase;
  if(mb){ mb.onclick=e=>{ if(e.target===mb) closeModal(); }; if(mt) mt.focus(); }
  const sl=$("#seclater"); if(sl) sl.onclick=()=>{S.resume="summary"; S.view="start"; render(); window.scrollTo({top:0});};
  document.querySelectorAll(".pk").forEach(b=>b.onclick=()=>{S.log=S.log.slice(0,S.p1len); S.pts=S.p1pts; buildPhase2(+b.dataset.p); render(); window.scrollTo({top:0});});
  const ch=$("#change"); if(ch) ch.onclick=()=>{S.view="pick"; render(); window.scrollTo({top:0});};
  const tm=$("#terminar"); if(tm) tm.onclick=()=>{ tm.disabled=true; bigFanfare(); S.completed=true; S.secs=[...(S.secs1||S.secs),...S.secs]; saveProgress(); setTimeout(()=>{ S.view="intro"; render(); window.scrollTo({top:0}); },2000); };
  const sp=$("#spk"); if(sp) sp.onclick=()=>{const c=cur(); if(c.t==="haz") speak(QA[H[c.hid].t][0]+" ¿Qué haces? "+S.cs.opts.map(o=>o.t).join(". "));};
  if(S.view==="play"&&S.cs&&S.cs.scene&&S.cs.step==="q"){ const sc=SCENES[S.cs.scene]; const id=Object.keys(sc.hot).find(k=>sc.hot[k].ok); const f=document.querySelector('.hot[data-id="'+id+'"]'); if(f) f.classList.add("found"); }
}
/* ---- Admin: gestion de participantes ---- */
function adminView(){
  const list=(S.adminData||[]);
  const rows=list.map(r=>`<tr><td>${esc(r.nombre)}</td><td>${esc(r.dni)}</td><td>${r.completado?"<span class=\"ok\">Completado</span>":r.actualizado_en?"En progreso":"Sin iniciar"}</td><td>${r.puntos!=null?r.puntos:"-"}</td></tr>`).join("");
  return `<div class="card"><div class="eyebrow">Administración</div><h1>Gestión de participantes</h1>
  <p style="margin:0 0 16px">Agrega personas para que puedan ingresar al juego con su DNI.</p>
  ${S.adminMsg?`<div class="save-note" style="color:var(--ok)">${esc(S.adminMsg)}</div>`:""}
  ${S.adminErr?`<div class="fb no" role="alert">${esc(S.adminErr)}</div>`:""}
  <h3>Agregar una persona</h3>
  <div class="fld"><label for="anm">Nombre y apellido</label><input id="anm" type="text" maxlength="60" placeholder="Ej. Juan Pérez"></div>
  <div class="fld"><label for="adni">DNI</label><input id="adni" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="8 dígitos"></div>
  <div class="row"><button class="btn" id="adminAdd">Agregar</button></div>
  <h3 style="margin-top:24px">Agregar varias (una por linea: DNI,Nombre)</h3>
  <div class="fld"><textarea id="abulk" rows="6" placeholder="40667929,Juan Pérez&#10;12345678,María Gómez&#10;87654321,Pedro López" style="font-family:inherit;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%"></textarea></div>
  <div class="row"><button class="btn" id="adminBulk">Agregar lista</button></div>
  <h3 style="margin-top:24px">Participantes registrados (${list.length})</h3>
  ${list.length?`<div class="row" style="justify-content:flex-end;margin-bottom:10px"><button class="btn alt" id="adminReload">Actualizar lista</button></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.9rem"><thead><tr style="text-align:left;color:var(--muted);border-bottom:2px solid var(--line)"><th style="padding:8px 6px">Nombre</th><th style="padding:8px 6px">DNI</th><th style="padding:8px 6px">Estado</th><th style="padding:8px 6px">Puntos</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p style="color:var(--muted)">Aún no hay participantes. Agrega el primero arriba.</p><div class="row"><button class="btn alt" id="adminReload">Cargar lista</button></div>`}
  <div class="row" style="margin-top:20px"><button class="btn alt" id="adminExit">Salir del panel</button></div></div>`;
}
async function loadAdminData(){
  if(!window._lookupDni) return;
  try{
    const { supabase } = await import('./src/supabase.js');
    const { data, error } = await supabase.rpc('listar_participantes');
    if(error){ S.adminErr="No se pudo cargar la lista."; S.adminData=S.adminData||[]; render(); return; }
    S.adminData=data||[]; S.adminErr=null; render();
  }catch(e){ S.adminErr="Error de conexión."; render(); }
}
async function adminAddOne(){
  const nm=($("#anm").value||"").trim(), dv=($("#adni").value||"").trim();
  S.adminMsg=null; S.adminErr=null;
  if(nv_check(nm,dv)) return;
  try{
    const { supabase } = await import('./src/supabase.js');
    const { error } = await supabase.rpc('agregar_participante', { p_dni: dv, p_nombre: nm });
    if(error){ S.adminErr="No se pudo agregar: "+error.message; render(); return; }
    S.adminMsg=""+nm+" (DNI "+dv+") agregado correctamente."; $("#anm").value=""; $("#adni").value=""; loadAdminData();
  }catch(e){ S.adminErr="Error de conexión."; render(); }
  function nv_check(n,d){ if(n.length<5||!/\S+\s+\S+/.test(n)){ S.adminErr="Escribe nombre y apellido."; render(); return true; } if(!/^\d{8}$/.test(d)){ S.adminErr="Escribe un DNI de 8 números."; render(); return true; } return false; }
}
async function adminAddBulk(){
  const raw=($("#abulk").value||"").trim();
  S.adminMsg=null; S.adminErr=null;
  if(!raw){ S.adminErr="Pega al menos una linea."; render(); return; }
  const items=[];
  for(const line of raw.split("\n")){
    const t=line.trim(); if(!t) continue;
    const sep=t.indexOf(",")>-1?",":t.indexOf(";")>-1?";":t.indexOf("\t")>-1?"\t":null;
    if(!sep){ S.adminErr="Cada linea debe tener DNI y nombre separados por coma. Ej: 40667929,Juan Pérez"; render(); return; }
    const dv=t.slice(0,sep).trim(), nm=t.slice(sep+1).trim();
    if(!/^\d{8}$/.test(dv)||nm.length<3){ S.adminErr="Linea invalida: "+t; render(); return; }
    items.push({dni:dv,nombre:nm});
  }
  if(!items.length){ S.adminErr="No se encontraron entradas validas."; render(); return; }
  try{
    const { supabase } = await import('./src/supabase.js');
    const { data, error } = await supabase.rpc('agregar_participantes_lote', { p_lista: JSON.stringify(items) });
    if(error){ S.adminErr="No se pudo agregar: "+error.message; render(); return; }
    const r=data||{}; S.adminMsg=(r.agregados||0)+" participantes agregados."+(r.errores&&r.errores.length?" Errores: "+r.errores.join("; "):""); $("#abulk").value=""; loadAdminData();
  }catch(e){ S.adminErr="Error de conexión."; render(); }
}
function tapHot(el){
  const cs=S.cs; if(!cs||cs.step!=="find") return;
  const sc=SCENES[cs.scene], id=el.dataset.id, h=sc.hot[id];
  if(h.ok){ cs.step="q"; cs.msg=null; render(); const a=document.querySelector(".situ"); if(a&&a.scrollIntoView) a.scrollIntoView({behavior:"smooth",block:"start"}); }
  else { cs.first=false; cs.msg=h.fb; render(); const g=document.querySelector('.hot[data-id="'+id+'"]'); if(g) g.classList.add("shake"); }
}
function tapOpt(k){
  const cs=S.cs; if(!cs||cs.done) return;
  const o=cs.opts[k], c=cur();
  if(o.ok){
    cs.done=true; cs.msg=null; S.modal=true;
    const ok=cs.first&&cs.wrong.length===0;
    if(ok) S.pts++;
    cs.ok=ok;
    S.log.push({area:sec().title,ok});
    chime();
  } else { cs.wrong.push(k); cs.first=false; cs.msg=c.t==="haz"?"Esa medida no controla el peligro o es incompleta. Prueba con otra.":"Ese tiene un nivel menor. Prueba con el otro."; }
  render();
}
function next(){
  if(S.qi<sec().cases.length-1){ S.qi++; newCase(); S.view="play"; }
  else { S.view="summary"; fanfare(); }
  render(); window.scrollTo({top:0});
}
function continueCase(){
  S.modal=false;
  next();
}
function back(){
  if(S.modal) return;
  const v=S.view;
  if(v==="play"){ if(S.qi>0){S.qi--; newCase();} else S.view="intro"; }
  else if(v==="summary"){ S.qi=sec().cases.length-1; newCase(); S.view="play"; }
  else if(v==="intro"){ S.resume="intro"; S.view="start"; }
  else if(v==="pick"){ S.phase=1; S.puesto=null; S.secs=S.secs1; S.si=S.secs.length-1; S.view="summary"; }
  else if(v==="result"){ S.si=S.secs.length-1; S.view="summary"; }
  render(); window.scrollTo({top:0});
}
$("#back").onclick=back;
$("#home").onclick=()=>{ goToFichas(); render(); window.scrollTo({top:0}); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.modal) closeModal(); });
$("#snd").onclick=()=>{SND=!SND; if(SND) chime(); headUpdate();};
window.S=S; window._rerender=render;
render();
</script>
<script type="module" src="/src/sync.js"></script>
